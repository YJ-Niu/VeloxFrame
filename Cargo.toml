[package]
name = "rspandas"
version = "1.0.1"
edition = "2024"

[lib]
name = "rspandas"
crate-type = ["cdylib", "rlib"]
path = "rust/src/lib.rs"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[dependencies]
pyo3 = { version = "0.30.1" }
csv = "1.4.0"
rayon = "1.12.0"
calamine = "0.38.0"
rust_xlsxwriter = "0.104.0"
# Arrow + Parquet: 用于在 Rust 层实现 Parquet/Feather 读写，替代 pyarrow 依赖
# default-features=false 只启用需要的编解码器，控制编译时间和 .so 体积
arrow = { version = "60.2.0", default-features = false, features = ["ipc"] }
parquet = { version = "60.2.0", default-features = false, features = [
    "arrow",
    "snap",
    "flate2-rust_backend",
    "zstd",
] }
# JSON 读写 (纯 Rust，无外部 C 依赖)
serde_json = "1.0"

[profile.release]
opt-level = 3
# thin LTO：与 fat LTO 性能差距极小（通常 <2%），但链接阶段耗时大幅下降，
# 且增量构建时无需全量重做 LTO，显著缩短日常构建时间
lto = "thin"
# 使用默认 codegen-units=16：允许并行代码生成，编译更快；对运行性能影响轻微
strip = "symbols"
panic = "abort"

# 第三方依赖用 opt-level="z"（体积优先），rspandas 自身代码保持 opt-level=3（性能优先）。
# 这样在不牺牲自身数据处理性能的前提下，大幅压缩 arrow/parquet 等大依赖的 .so 体积。
# [profile.release.package."*"]
# opt-level = "z"

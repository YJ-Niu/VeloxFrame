name: CI

on:
  push:
    branches: [main]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYO3_PYTHON: python

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 解释器由 actions/setup-python 提供 (hostedtoolcache 或官方预编译二进制),
          # 无需 deadsnakes PPA; pyo3 编译仅需主源的 libffi-dev
          sudo apt-get update
          sudo apt-get install -y libffi-dev

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install maturin
        run: python -m pip install maturin

      - name: Install rsarray
        run: python -m pip install rsarray

      - name: Build wheel
        run: maturin build --release --out dist -i python

      - name: Install built wheel
        run: python -m pip install --no-index --find-links dist veloxframe

      - name: Run Python smoke test
        run: python testing/smoke_test.py

  rust-lint:
    name: Rust Lint (rustfmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build dependencies (Ubuntu)
        run: |
          # 解释器由 actions/setup-python 提供 (hostedtoolcache 或官方预编译二进制),
          # 无需 deadsnakes PPA; pyo3 编译仅需主源的 libffi-dev
          sudo apt-get update
          sudo apt-get install -y libffi-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build dependencies (Ubuntu)
        run: |
          # 解释器由 actions/setup-python 提供 (hostedtoolcache 或官方预编译二进制),
          # 无需 deadsnakes PPA; pyo3 编译仅需主源的 libffi-dev
          sudo apt-get update
          sudo apt-get install -y libffi-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
